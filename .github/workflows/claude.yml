# Issue sessions (ADR-0014). This workflow only starts the issue-session
# routine in Emil's cloud environment, through its API trigger. The session
# does the work, under eng/routines/issue-session.md. A start comes only
# from Hafeok: the claude label, or an issue comment starting "@claude" that
# was typed by hand, not made through an app (D2).
# eng/gates/claude-workflow.sh checks this file against that prompt.
name: claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  start-routine:
    name: start the issue-session routine
    if: >-
      (github.event_name == 'issues'
        && github.event.label.name == 'claude'
        && github.event.sender.login == 'Hafeok')
      || (github.event_name == 'issue_comment'
        && !github.event.issue.pull_request
        && github.event.comment.user.login == 'Hafeok'
        && github.event.comment.performed_via_github_app == null
        && startsWith(github.event.comment.body, '@claude'))
    runs-on: ubuntu-24.04
    # D4: the two secrets live in this environment, whose deployment
    # branches are limited to main, not in the repository.
    environment: claude-routine
    timeout-minutes: 5
    concurrency:
      group: claude-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # D3: one attempt, no retry (the fire API has no idempotency). The text
      # names the start and nothing else: no issue or comment text is sent.
      - name: Fire the routine
        shell: bash
        env:
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          EVENT: ${{ github.event_name }}
          SENDER: ${{ github.event.sender.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          text=$(printf '%s\n' \
            "repository: $REPOSITORY" \
            "issue: $ISSUE" \
            "event: $EVENT" \
            "sender: $SENDER" \
            "comment-id: ${COMMENT_ID:-none}" \
            "comment-author: ${COMMENT_AUTHOR:-none}" \
            "workflow-run: $RUN_URL")
          jq -n --arg text "$text" '{text: $text}' > "$RUNNER_TEMP/fire.json"
          # The response is kept out of the public log on success (it names
          # the session); on failure it is the API's error, which is printed.
          if ! curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$ROUTINE_FIRE_URL" \
            -H "Authorization: Bearer $ROUTINE_FIRE_TOKEN" \
            -H "anthropic-version: 2026-10-21" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/fire.json" \
            -o "$RUNNER_TEMP/fire-response.json"; then
            cat "$RUNNER_TEMP/fire-response.json" 2>/dev/null || true
            exit 1
          fi
          echo "claude: the routine started a session for #$ISSUE ($EVENT)"
