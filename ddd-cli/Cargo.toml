[package]
name = "ddd-cli"
version = "0.7.0"
edition = "2021"
authors = ["PiCloud Contributors"]
license = "Apache-2.0"
description = "Decision-Driven Design governance CLI: init, validate, why over the repo-local .ddd/ graph."
repository = "https://github.com/Hafeok/product-cli"
homepage = "https://github.com/Hafeok/product-cli"
readme = "../README.md"

[[bin]]
name = "ddd"
path = "src/main.rs"

[lints]
workspace = true

# Kept out of the cargo-dist release set for M1 so adding the binary does not
# silently change the published artifact list; revisit when `ddd` ships.
[package.metadata.dist]
dist = false

[dependencies]
ddd-core     = { path = "../ddd-core", version = "0.7.0" }
ddd-lsp      = { path = "../ddd-lsp", version = "0.7.0" }
ddd-mcp      = { path = "../ddd-mcp", version = "0.7.0" }
ledger-core  = { path = "../ledger-core", version = "0.7.0" }
product-core = { path = "../product-core", version = "0.7.0" }
chrono       = "0.4"
clap         = { version = "4", features = ["derive"] }
serde_json   = "1"
serde_yaml   = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde      = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tempfile   = "3"
