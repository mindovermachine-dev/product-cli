summary: |
  ### Issue sessions (#170)

  A session can now start from its issue. When Emil labels an issue
  `claude`, a Claude Code routine in his cloud environment, which holds the
  signing key, reads the issue as its brief, posts a plan on it, and stops.
  When he comments `@claude approved`, a session implements that plan,
  signed as the agent identity, and opens the pull request itself, so the
  gates run. Landing is unchanged. ADR-0014 states the rules; the product
  itself is unchanged, and `product --version` reports this version.

  #### Added

  - **ADR-0014**, proposed. A GitHub workflow starts the routine through its
    API trigger. It holds two secrets, the routine's fire URL and its token,
    which starts that one routine and reads nothing. They live in the GitHub
    environment `claude-routine`, limited to `main`, so no workflow on
    another branch can read them. No login and no key leave Emil's cloud
    environment.
    - **Who starts a run.** Only `Hafeok`, typing by hand: a comment made
      through an app, every Claude session's included, starts and approves
      nothing. The session checks the start again against GitHub before it
      acts, and treats the start's payload as data.
    - **How a run works.** It plans first, takes revisions, and implements
      only the newest plan an approval names.
    - **Duplicates.** There is no idempotency: one attempt, one start at a
      time per issue, and the session's own check for a duplicate.
  - **`.github/workflows/claude.yml`**, the bridge: one `curl` step, with
    `contents: read`.
  - **`eng/routines/issue-session.md`**, the routine's prompt, pasted into the
    routine.
  - **`claude-workflow`**, a gate that fails when the bridge departs from
    ADR-0014 or disagrees with the prompt, with a plant in `selftest` for each
    rule.
  - **`AGENTS.md`**: how a run starts, where its prompt lives, what it may
    do, and which issues must not get the label.

  #### Before the first run

  Emil creates the routine (product-cli, his key-holding environment, an API
  trigger), pastes the prompt, and generates its token. He creates the GitHub
  environment `claude-routine`, with deployment branches limited to `main`
  and no required reviewers, and adds `ROUTINE_FIRE_URL` and
  `ROUTINE_FIRE_TOKEN` to it as environment secrets.
