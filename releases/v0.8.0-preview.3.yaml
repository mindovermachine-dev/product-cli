summary: |
  ### Issue sessions (#170)

  A session can now start from its issue. When Emil labels an issue
  `claude`, a GitHub Actions run of the Claude Code action reads the issue
  as its brief, posts a plan on it, and stops. When he comments
  `@claude approved`, a second run implements that plan on a branch, signed
  as the agent identity, and posts a link to open the pull request.
  Landing is unchanged. ADR-0014 states the rules; the product itself is
  unchanged, and `product --version` reports this version.

  #### Added

  - **ADR-0014**, proposed. It admits `anthropics/claude-code-action`
    v1.0.268, pinned by SHA. Runs start only from `Hafeok`, on an issue,
    behind the action's own write-access check. Commits are signed with
    the agent key as `Claude (Emil)`, and Claude Code's attribution is
    off, so no model is named. Authentication is the OAuth token. A run
    plans first; a `@claude` comment revises the plan; `@claude approved`
    approves the newest one. One repository, 180 minutes, one run per
    issue, and no `workflows` permission.
  - **`.github/workflows/claude.yml`**, as ADR-0014 states it.
  - **`claude-workflow`**, a gate that fails when `claude.yml` departs from
    ADR-0014, with a plant in `selftest` for each rule it checks.
  - **`AGENTS.md`**: how to start a run, what it may do, and which issues
    must not get the label.

  #### Before the first run

  Emil adds the secrets `CLAUDE_CODE_OAUTH_TOKEN` and
  `AGENT_SSH_SIGNING_KEY`. Pushes made with the job token start no
  workflow, so Emil opens each run's pull request from its link, and checks
  that `gates.yml` ran on the head before approving it.
