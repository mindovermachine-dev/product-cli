id: seam/rust/ledger-core-src-layout-rs
boundary: contract surface of ledger-core/src/layout.rs
verdict_knowledge: 'Consumers learn the one module that knows the store layout: every namespace lives under .decisions/ns/<ns>/ with its own sets/, roles/, log/, sig/ and allowed_signers, a path''s namespace is its directory, and a file at the v1.8 flat paths or anywhere else under .decisions/ outside ns/ and index/ is a schema fault (LP-3.34, rulings 62 and 63).'
