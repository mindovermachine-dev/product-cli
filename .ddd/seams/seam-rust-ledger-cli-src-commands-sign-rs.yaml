id: seam/rust/ledger-cli-src-commands-sign-rs
boundary: contract surface of ledger-cli/src/commands/sign.rs
verdict_knowledge: 'A caller learns that `accept` has two shapes over one meaning: naming a decision signs it immediately, while naming a selection (--set / --group, the same selector syntax `show` reads) enumerates it, pins it with a manifest hash, prints it, and writes nothing — signing then requires --confirm carrying that manifest, a value only a dry run can produce. What it cannot do is cover the whole store implicitly, and it never widens what a signature binds: the batched path files one acceptance record per decision, each on its own version hash.'
