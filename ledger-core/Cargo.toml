[package]
name = "ledger-core"
version = "0.7.0"
edition = "2021"
authors = ["PiCloud Contributors"]
license = "Apache-2.0"
description = "Decision Ledger record substrate: append-only file format, canonicalisation, version hashing, verify rules."
repository = "https://github.com/Hafeok/product-cli"
homepage = "https://github.com/Hafeok/product-cli"
readme = "../README.md"

[lib]
name = "ledger_core"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
product-core = { path = "../product-core", version = "0.7.0" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2       = "0.10"
chrono     = { version = "0.4", features = ["serde"] }
unicode-normalization = "0.1"
# DSSE verification (#70, D4): the open CLI verifies the hosted service's
# envelopes and never signs them. std has no ed25519; the crate is already
# in the workspace through spec-core.
ed25519-dalek = "2"

[dev-dependencies]
tempfile = "3"
