# FIXTURE — NOT A DETERMINATION, NOT PART OF ANY STORE.
#
# R-Q38: "if we dont supply carrier that needs to an explicit decision made by a human.
# Because its vital for the systems design."
#
# So this is the OTHER lawful shape: the carrier is not supplied, and a named human
# principal says so and carries it. Compare `dsc-0003.carrier-modelled.yaml`, which
# supplies one.
#
# The form mirrors the schema's own `allocation.residual`: a principal is required and
# its `kind` excludes `machine`, because — the schema's words — "a model identity cannot
# be an accepting principal". An agent may not decide that the carrier of a fact does not
# matter. A reader that finds no principal here treats the absence as unattributed, not
# as a decision.
#
# `made_by` says what this file is. It is not in inputs/ and nothing loads it but the
# test demonstrating the proposal.

