note: 'The remedy for DDD-gates-02, filed for the principal''s acceptance and deliberately not implemented by the session that filed it. A red build must say what it did not check: independent gates run anyway, or — the floor, where a step genuinely depends on a failed one — the run reports which gates did not execute. Allocated as a judgment because nothing checks the arrangement yet, so holding to it rests on a person; a criterion here would name a discharge pointer that resolves to no checker. When the workflow edit lands, re-allocating to a criterion whose discharge names the check that then exists is a new version, not an edit. Cost of the follow-up: a red build stops failing fast and pays each independent gate''s runtime, the benchmark step most of all.'
