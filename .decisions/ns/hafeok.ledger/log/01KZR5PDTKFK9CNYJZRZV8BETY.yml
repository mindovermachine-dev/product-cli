  hash: sha256:b72a4aef034bead5739179511d64b1decc9e76cb2a9f3d382953f291cceeb2d7
  set: ledger-design
  statement: 'Acceptances never survive reconciliation. Acceptance signs a version hash; a reconciliation that produces a new version produces an unaccepted version — the prior acceptances remain in the log as historical facts about the exact versions they signed, and the reconciled version awaits fresh acceptance. No transfer, no inheritance, no close-enough: the same law as revise — content moves, acceptance does not follow it.'
  allocation: constraint
  discharge:
  - analyzer:ledger-merge.reconciled-version-unaccepted
  tolerance_floor_at_creation: T1
  tolerance_override: T2
