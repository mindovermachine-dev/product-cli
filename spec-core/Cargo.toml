[package]
name = "spec-core"
version = "0.7.0"
edition = "2021"
authors = ["PiCloud Contributors"]
license = "Apache-2.0"
description = "Specification-flow act-time records: the write-back leg `implement` opens, only a principal closes."
repository = "https://github.com/Hafeok/product-cli"
homepage = "https://github.com/Hafeok/product-cli"
readme = "../README.md"

[lib]
name = "spec_core"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
product-core = { path = "../product-core", version = "0.7.0" }
ledger-core  = { path = "../ledger-core", version = "0.7.0" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono     = { version = "0.4", features = ["serde"] }
# Signing. ed25519 because the signature is small, the verification is fast,
# and the key is a value a person can carry — the acceptance leg is only
# worth the adoption cost if holding a key is cheap.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core  = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"
