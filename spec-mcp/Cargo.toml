[package]
name = "spec-mcp"
version = "0.7.0"
edition = "2021"
authors = ["PiCloud Contributors"]
license = "Apache-2.0"
description = "Specification-flow MCP surface: the delegable verbs only, never the ones that name a principal."
repository = "https://github.com/Hafeok/product-cli"
homepage = "https://github.com/Hafeok/product-cli"
readme = "../README.md"

[lib]
name = "spec_mcp"
path = "src/lib.rs"

[[bin]]
name = "spec-mcp"
path = "src/bin/spec-mcp.rs"

[lints]
workspace = true

[package.metadata.dist]
dist = false

[dependencies]
spec-core    = { path = "../spec-core", version = "0.7.0" }
product-core = { path = "../product-core", version = "0.7.0" }
product-mcp  = { path = "../product-mcp", version = "0.7.0" }
ledger-core  = { path = "../ledger-core", version = "0.7.0" }
chrono       = "0.4"
serde_json   = "1"

[dev-dependencies]
tempfile = "3"
