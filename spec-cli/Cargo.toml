[package]
name = "spec-cli"
version = "0.6.0"
edition = "2021"
authors = ["PiCloud Contributors"]
license = "Apache-2.0"
description = "Specification-flow CLI: the non-delegable half — open, close, and gate act-time records."
repository = "https://github.com/Hafeok/product-cli"
homepage = "https://github.com/Hafeok/product-cli"
readme = "../README.md"

[[bin]]
name = "spec"
path = "src/main.rs"

[lints]
workspace = true

# Out of the cargo-dist release set while the flow is a single vertical
# slice; adding the binary must not silently change the published list.
[package.metadata.dist]
dist = false

[dependencies]
spec-core    = { path = "../spec-core", version = "0.6.0" }
ledger-core  = { path = "../ledger-core", version = "0.6.0" }
product-core = { path = "../product-core", version = "0.6.0" }
eval-core    = { path = "../eval-core", version = "0.6.0" }
chrono     = "0.4"
serde      = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
ed25519-dalek = "2"
clap       = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
serde_json = "1"
predicates = "3"
tempfile   = "3"
